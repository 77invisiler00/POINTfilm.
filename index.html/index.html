<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POINTFILM — Fixed Player</title>
    <style>
        :root { --red: #ff0000; --bg: #050505; --card: #111; --purple: #8a2be2; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding-bottom: 50px; }
        header { background: #000; padding: 20px; text-align: center; border-bottom: 3px solid var(--red); }
        .logo { color: var(--red); font-size: 30px; font-weight: 900; text-decoration: none; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        
        /* Плеєр */
        .player-box { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #222; margin-bottom: 30px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .title-bar { padding: 15px; background: #111; font-weight: bold; font-size: 20px; border-top: 1px solid #222; }

        /* Сітка */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .card { background: var(--card); border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid #222; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: var(--red); }
        .card img { width: 100%; height: 120px; object-fit: cover; display: block; }
        .card-name { padding: 10px; text-align: center; font-size: 14px; }

        /* Адмінка */
        .admin-btn { background: var(--purple); color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; display: inline-block; margin: 10px; font-size: 12px; }
        #adminPanel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 20px; border-radius: 10px; z-index: 3000; border: 1px solid var(--purple); width: 300px; }
        #adminPanel input { width: 90%; padding: 8px; margin: 5px 0; background: #000; color: white; border: 1px solid #333; }
        
        .del-btn { display: none; position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }
        .edit-mode .del-btn { display: block; }
    </style>
</head>
<body onload="loadCloud()">

<div class="admin-btn" onclick="openAdmin()">Admin Panel</div>

<div id="adminPanel">
    <input type="text" id="mName" placeholder="Назва">
    <input type="text" id="mLink" placeholder="Посилання YouTube">
    <button onclick="addCloud()" style="width:100%; padding:10px; background:var(--purple); color:white; border:none; margin-top:10px; cursor:pointer;">Додати</button>
    <button onclick="toggleEdit()" style="width:100%; padding:10px; background:red; color:white; border:none; margin-top:5px; cursor:pointer;">Режим видалення</button>
    <button onclick="document.getElementById('adminPanel').style.display='none'" style="width:100%; margin-top:5px; background:#444; color:white; border:none; padding:5px; cursor:pointer;">Закрити</button>
</div>

<header><a href="#" class="logo">POINTFILM</a></header>

<div class="container" id="mainZone">
    <div class="player-box">
        <div class="video-container" id="playerWrapper">
            <div style="color:#555; position:absolute; top:45%; left:35%;">Оберіть мультик для перегляду</div>
        </div>
        <div class="title-bar" id="curTitle">Вітаємо!</div>
    </div>

    <h2 style="border-left: 4px solid red; padding-left: 10px;">Всі мультфільми</h2>
    <div class="grid" id="movieGrid"></div>
</div>

<script>
    // ПЕРЕВІР, ЩО ТУТ ТВОЄ ПОСИЛАННЯ І В КІНЦІ Є .json
    const DB_URL = "https://pointfilm-964c0-default-rtdb.firebaseio.com/movies.json";

    async function loadCloud() {
        try {
            const resp = await fetch(DB_URL);
            const data = await resp.json();
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            
            if (data) {
                Object.entries(data).forEach(([key, val]) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <button class="del-btn" onclick="deleteCloud('${key}')">X</button>
                        <img src="https://img.youtube.com/vi/${val.id}/mqdefault.jpg" onclick="playVideo('${val.id}', '${val.name}')">
                        <div class="card-name">${val.name}</div>
                    `;
                    grid.appendChild(card);
                });
            }
        } catch (e) { console.error("Помилка завантаження", e); }
    }

    function playVideo(id, name) {
        const wrapper = document.getElementById('playerWrapper');
        // Повністю переписуємо iframe, щоб він точно запрацював
        wrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allowfullscreen allow="autoplay"></iframe>`;
        document.getElementById('curTitle').innerText = name;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function addCloud() {
        const name = document.getElementById('mName').value;
        const link = document.getElementById('mLink').value;
        const id = link.includes('v=') ? link.split('v=')[1].split('&')[0] : link.split('/').pop();

        if (name && id) {
            await fetch(DB_URL, { method: 'POST', body: JSON.stringify({ name, id }) });
            document.getElementById('mName').value = '';
            document.getElementById('mLink').value = '';
            loadCloud();
        }
    }

    async function deleteCloud(key) {
        if (confirm("Видалити?")) {
            await fetch(DB_URL.replace('.json', `/${key}.json`), { method: 'DELETE' });
            loadCloud();
        }
    }

    function openAdmin() { if(prompt("Пароль:") === "lol demid509") document.getElementById('adminPanel').style.display='block'; }
    function toggleEdit() { document.getElementById('mainZone').classList.toggle('edit-mode'); }

    // Перевірка оновлень кожні 5 сек
    setInterval(loadCloud, 5000);
</script>
</body>
</html>
