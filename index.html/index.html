<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POINTFILM — Mobile Fixed</title>
    <style>
        :root { --red: #ff0000; --bg: #050505; --card: #111; --purple: #8a2be2; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding-bottom: 50px; -webkit-tap-highlight-color: transparent; }
        header { background: #000; padding: 15px; text-align: center; border-bottom: 3px solid var(--red); position: sticky; top: 0; z-index: 1000; }
        .logo { color: var(--red); font-size: 28px; font-weight: 900; text-decoration: none; text-transform: uppercase; }
        .container { max-width: 1000px; margin: auto; padding: 15px; }
        
        /* Плеєр з покращеною адаптивністю */
        .player-box { background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #222; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .title-bar { padding: 15px; background: #111; font-weight: bold; font-size: 18px; border-top: 1px solid #222; color: #eee; }

        /* Сітка карток */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .card { background: var(--card); border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.2s; border: 1px solid #222; position: relative; }
        .card:active { transform: scale(0.95); } /* Ефект натискання для телефону */
        .card img { width: 100%; height: 100px; object-fit: cover; display: block; pointer-events: none; }
        .card-name { padding: 8px; text-align: center; font-size: 12px; font-weight: 500; }

        /* Адмінка */
        .admin-btn { background: var(--purple); color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; display: inline-block; margin: 10px; font-size: 11px; opacity: 0.7; }
        #adminPanel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 20px; border-radius: 10px; z-index: 3000; border: 1px solid var(--purple); width: 280px; box-shadow: 0 0 100px #000; }
        #adminPanel input { width: 90%; padding: 10px; margin: 5px 0; background: #000; color: white; border: 1px solid #333; border-radius: 5px; }
        
        .del-btn { display: none; position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; z-index: 10; }
        .edit-mode .del-btn { display: block; }
        h2 { font-size: 20px; margin: 20px 0 15px; border-left: 4px solid var(--red); padding-left: 10px; }
    </style>
</head>
<body onload="loadCloud()">

<div class="admin-btn" onclick="openAdmin()">ADMIN</div>

<div id="adminPanel">
    <input type="text" id="mName" placeholder="Назва мультика">
    <input type="text" id="mLink" placeholder="Посилання YouTube">
    <button onclick="addCloud()" style="width:100%; padding:12px; background:var(--purple); color:white; border:none; margin-top:10px; border-radius:5px;">ДОДАТИ</button>
    <button onclick="toggleEdit()" style="width:100%; padding:10px; background:red; color:white; border:none; margin-top:5px; border-radius:5px;">ВИДАЛИТИ</button>
    <button onclick="document.getElementById('adminPanel').style.display='none'" style="width:100%; margin-top:10px; background:#444; color:white; border:none; padding:8px; border-radius:5px;">ЗАКРИТИ</button>
</div>

<header><a href="#" class="logo">POINTFILM</a></header>

<div class="container" id="mainZone">
    <div class="player-box">
        <div class="video-container" id="playerWrapper">
            <div style="color:#444; position:absolute; top:45%; width:100%; text-align:center; font-size:14px;">Натисніть на мультик нижче</div>
        </div>
        <div class="title-bar" id="curTitle">Оберіть відео</div>
    </div>

    <h2>Мультфільми</h2>
    <div class="grid" id="movieGrid"></div>
</div>

<script>
    // Твоє посилання на базу
    const DB_URL = "https://pointfilm-964c0-default-rtdb.firebaseio.com/movies.json";

    async function loadCloud() {
        try {
            const resp = await fetch(DB_URL);
            const data = await resp.json();
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            
            if (data) {
                Object.entries(data).reverse().forEach(([key, val]) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <button class="del-btn" onclick="deleteCloud(event, '${key}')">X</button>
                        <img src="https://img.youtube.com/vi/${val.id}/mqdefault.jpg">
                        <div class="card-name">${val.name}</div>
                    `;
                    // Обробка натискання для мобільних
                    card.onclick = () => playVideo(val.id, val.name);
                    grid.appendChild(card);
                });
            }
        } catch (e) { console.log("Помилка завантаження"); }
    }

    function playVideo(id, name) {
        const wrapper = document.getElementById('playerWrapper');
        document.getElementById('curTitle').innerText = name;
        
        // Очищуємо і створюємо iframe заново (це фікс для мобільних)
        wrapper.innerHTML = '';
        const ifr = document.createElement('iframe');
        // Додаємо origin, щоб мобільний браузер довіряв плеєру
        ifr.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1&enablejsapi=1`;
        ifr.allow = "autoplay; fullscreen";
        ifr.allowFullscreen = true;
        
        wrapper.appendChild(ifr);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function addCloud() {
        const name = document.getElementById('mName').value;
        const link = document.getElementById('mLink').value;
        if (!name || !link) return;
        
        const id = link.includes('v=') ? link.split('v=')[1].split('&')[0] : link.split('/').pop().split('?')[0];

        await fetch(DB_URL, { method: 'POST', body: JSON.stringify({ name, id }) });
        document.getElementById('mName').value = '';
        document.getElementById('mLink').value = '';
        loadCloud();
    }

    async function deleteCloud(event, key) {
        event.stopPropagation(); // Щоб відео не вмикалося при натисканні на X
        if (confirm("Видалити?")) {
            await fetch(DB_URL.replace('.json', `/${key}.json`), { method: 'DELETE' });
            loadCloud();
        }
    }

    function openAdmin() { if(prompt("Пароль:") === "lol demid509") document.getElementById('adminPanel').style.display='block'; }
    function toggleEdit() { document.getElementById('mainZone').classList.toggle('edit-mode'); }

    // Авто-оновлення
    setInterval(loadCloud, 7000);
</script>
</body>
</html>
