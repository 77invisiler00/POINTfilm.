<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POINTfilm — Cloud Memory</title>
    <style>
        :root { --red: #ff0000; --bg: #050505; --card: #111; --blue: #5865F2; --purple: #8a2be2; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 100px; }
        
        /* Адмін-панель */
        .admin-trigger { background: var(--purple); height: 40px; width: 140px; margin: 10px auto; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: 0.3s; font-size: 14px; }
        #adminPanel { display: none; background: #1a1a1a; padding: 20px; border: 2px solid var(--purple); border-radius: 10px; max-width: 400px; margin: 10px auto; text-align: center; position: fixed; top: 15%; left: 50%; transform: translateX(-50%); z-index: 2000; box-shadow: 0 0 50px rgba(0,0,0,1); }
        #adminPanel input { width: 90%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: white; }
        .admin-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; }
        .admin-btns button { border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* Картки */
        .delete-badge { display: none; position: absolute; top: 10px; right: 10px; background: red; color: white; width: 30px; height: 30px; border-radius: 50%; text-align: center; line-height: 28px; font-weight: bold; z-index: 100; cursor: pointer; border: 2px solid white; }
        .edit-mode .delete-badge { display: block; }
        header { background: #000; padding: 20px; text-align: center; border-bottom: 3px solid var(--red); position: sticky; top: 0; z-index: 1000; }
        .logo { color: var(--red); font-size: 32px; font-weight: 900; text-decoration: none; letter-spacing: 2px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .player-wrapper { background: #000; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8); margin-bottom: 30px; border: 1px solid #222; }
        .iframe-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .info-bar { padding: 20px; background: #111; font-size: 22px; font-weight: bold; }
        h2 { border-left: 5px solid var(--red); padding-left: 15px; margin: 40px 0 20px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: var(--card); border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; transition: 0.3s; }
        .card:hover { transform: scale(1.05); border: 1px solid var(--red); }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-name { padding: 10px; text-align: center; font-size: 14px; font-weight: bold; }
        
        /* Discord Overlay */
        #discordOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; }
        .white-strayk { color: var(--blue); font-size: 45px; font-weight: bold; margin-top: 20px; }
        .discord-btn { position: fixed; bottom: 30px; right: 30px; width: 70px; height: 70px; background: var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 999; cursor: pointer; border: 2px solid white; }
    </style>
</head>
<body onload="loadMovies()">

<div class="admin-trigger" onclick="openAdmin()">Admin Panel</div>

<div id="adminPanel">
    <h3>Адмінка</h3>
    <input type="text" id="newTitle" placeholder="Назва">
    <input type="text" id="newLink" placeholder="Посилання YouTube">
    <input type="text" id="newImg" placeholder="Фото (необов'язково)">
    <div class="admin-btns">
        <button onclick="addMovie()" style="background:var(--purple); color:white;">Додати</button>
        <button onclick="toggleDeleteMode()" style="background:red; color:white;">Видалення</button>
        <button onclick="closeAdmin()" style="background:#555; color:white;">Закрити</button>
    </div>
</div>

<header><a href="#" class="logo">POINTFILM</a></header>

<div class="container" id="mainContent">
    <div class="player-wrapper">
        <div class="iframe-container">
            <iframe id="mainPlayer" src="" allowfullscreen allow="autoplay"></iframe>
        </div>
        <div class="info-bar" id="currentTitle">Виберіть мультфільм</div>
    </div>

    <h2>🐾 Пригоди Пса Патрона</h2>
    <div class="movie-grid" id="patronGrid"></div>

    <h2>🎬 Популярні мультфільми</h2>
    <div class="movie-grid" id="popularGrid"></div>
</div>

<div id="discordOverlay">
    <div class="white-strayk">WhiteStrayk</div>
    <div class="like-emoji" style="font-size:100px;">👍</div>
</div>

<div class="discord-btn" onclick="goToDiscord()">
    <svg width="40" viewBox="0 0 127.14 96.36" fill="white"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.06,72.06,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.71,32.65-1.78,56.63.48,80.1a105.73,105.73,0,0,0,32.22,16.26,77.7,77.7,0,0,0,6.89-11.11,68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.24-16.27C129.38,51.24,121.81,27.5,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
</div>

<script>
    // Базовий список, якщо пам'ять порожня
    const defaultMovies = [
        { id: 'N8pCTdnmn4M', title: 'Патрон', category: 'patron' },
        { id: 'Js8-KR7tcEA', title: 'Пес Патрон: Всі серії', category: 'patron' },
        { id: 'RyY0jtWrejI', title: 'Патрон: Правило', category: 'patron' },
        { id: 'I5zkD355ilQ', title: 'ідички', category: 'popular' },
        { id: '2MnjrU9IcqQ', title: 'шпигунка', category: 'popular' }
    ];

    function playMovie(id, title) {
        // Виправлене посилання для вбудовування
        document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
        document.getElementById('currentTitle').innerText = title;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function extractID(url) {
        const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : url;
    }

    function saveMovies(movies) {
        localStorage.setItem('pointfilm_db', JSON.stringify(movies));
    }

    function loadMovies() {
        let movies = JSON.parse(localStorage.getItem('pointfilm_db')) || defaultMovies;
        renderGrid(movies);
        if(movies.length > 0) playMovie(movies[0].id, movies[0].title);
    }

    function renderGrid(movies) {
        const patronGrid = document.getElementById('patronGrid');
        const popularGrid = document.getElementById('popularGrid');
        patronGrid.innerHTML = '';
        popularGrid.innerHTML = '';

        movies.forEach((m, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            const img = m.img || `https://img.youtube.com/vi/${m.id}/maxresdefault.jpg`;
            card.innerHTML = `
                <div class="delete-badge" onclick="deleteMovie(${index})">X</div>
                <img src="${img}" onclick="playMovie('${m.id}', '${m.title}')">
                <div class="card-name">${m.title}</div>
            `;
            if(m.category === 'patron') patronGrid.appendChild(card);
            else popularGrid.appendChild(card);
        });
    }

    function addMovie() {
        const title = document.getElementById('newTitle').value;
        const link = document.getElementById('newLink').value;
        if(!title || !link) return alert("Заповни поля!");

        const movies = JSON.parse(localStorage.getItem('pointfilm_db')) || defaultMovies;
        movies.push({
            id: extractID(link),
            title: title,
            category: 'popular',
            img: document.getElementById('newImg').value || null
        });
        saveMovies(movies);
        loadMovies();
        closeAdmin();
    }

    function deleteMovie(index) {
        let movies = JSON.parse(localStorage.getItem('pointfilm_db')) || defaultMovies;
        movies.splice(index, 1);
        saveMovies(movies);
        loadMovies();
    }

    function openAdmin() {
        if(prompt("Пароль:") === "lol demid509") document.getElementById('adminPanel').style.display = 'block';
    }
    function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
    function toggleDeleteMode() { document.getElementById('mainContent').classList.toggle('edit-mode'); }
    function goToDiscord() {
        document.getElementById('discordOverlay').style.display = 'flex';
        setTimeout(() => { window.location.href = "https://discord.gg/RBdCxYdA"; }, 2000);
    }
</script>
</body>
</html>
